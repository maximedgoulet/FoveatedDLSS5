# Builds only renodx-dlss5.addon64 (the foveated DLSS 5 NR add-on in
# src/addons/dlss5) on GitHub's Windows runners.
#
# - Run workflow (manual): builds and attaches the add-on to the run as an
#   artifact.
# - Push a tag v* (e.g. v0.1.0), or Run workflow with "release" set to a new
#   tag name: builds, then publishes a GitHub release (creating the tag on the
#   built commit when needed) with the add-on and its SHA-256 attached. Tags with a suffix (v0.2.0-beta) and
#   all 0.x versions are marked pre-release. Release notes come from
#   .github/release-notes/<tag>.md when that file exists.
name: Build DLSS5 add-on

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure
        run: cmake --preset vs-x64

      - name: Build dlss5
        run: cmake --build --preset vs-x64-release --target dlss5 --verbose

      - name: Collect
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse -Path build.vs -Filter renodx-dlss5.addon64 | Select-Object -First 1
          if (-not $out) { throw "renodx-dlss5.addon64 not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $out.FullName dist/
          $hash = (Get-FileHash dist/renodx-dlss5.addon64 -Algorithm SHA256).Hash.ToLower()
          "$hash  renodx-dlss5.addon64" | Out-File -Encoding ascii dist/renodx-dlss5.addon64.sha256
          "SHA-256: $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: renodx-dlss5-foveated
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.release }}") { "${{ inputs.release }}" } else { "${{ github.ref_name }}" }
          $notes = ".github/release-notes/$tag.md"
          $ghArgs = @($tag, "dist/renodx-dlss5.addon64", "dist/renodx-dlss5.addon64.sha256",
                    "--title", "FoveatedDLSS5 $tag", "--target", "${{ github.sha }}")
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          if ($tag -match '-' -or $tag -match '^v0\.') { $ghArgs += "--prerelease" }
          gh release create @ghArgs
